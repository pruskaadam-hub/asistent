<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Asistent</title>
<style>
:root{
  --bg:#f6f5f2;--surface:#fff;--surface-2:#efede8;--text:#1d1c1a;--muted:#6b6862;--border:#dedad2;
  --accent:#2f5bd3;--accent-soft:#e6ecfb;--good:#2e7d4f;--good-soft:#e3f2e8;--warn:#a86a00;--warn-soft:#fbf0dc;--bad:#b3382c;--bad-soft:#f8e3e0;
  --radius:10px;--shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161614;--surface:#1f1e1c;--surface-2:#2a2926;--text:#ecebe7;--muted:#a19e97;--border:#38362f;
  --accent:#7d9cf0;--accent-soft:#25304d;--good:#6cc08f;--good-soft:#1f3328;--warn:#e3ae4f;--warn-soft:#3a2f1a;--bad:#ec8a7f;--bad-soft:#3d2320;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.bar{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.bar h1{font-size:17px;margin:0;font-weight:650}
.sync{margin-left:auto;font-size:13px;color:var(--muted)}
nav{max-width:980px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;padding:9px 10px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:980px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:15px;margin:18px 0 8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted);font-size:13px}
.title{font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 9px}
textarea{min-height:80px;resize:vertical}
select.inline{width:auto;padding:3px 6px;font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 12px}
.form .wide{grid-column:1/-1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;flex:1 1 160px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer}
.stat b{display:block;font-size:22px}
.md h3,.md h4{margin:12px 0 4px}.md ul{margin:4px 0;padding-left:20px}.md p{margin:6px 0}
.login{max-width:440px;margin:40px auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.done .title{text-decoration:line-through;color:var(--muted)}
pre.draft{white-space:pre-wrap;font:inherit;margin:6px 0;background:var(--surface-2);padding:8px 10px;border-radius:8px}
@media (max-width:600px){main{padding:12px}.bar{padding:10px 12px}}

/* Přehled oblastí */
:root{--radius:14px;--bg:#f3f5f8;--border:#e0e5ed;--muted:#606c80;--text:#202b3d;--shadow:0 4px 18px rgba(27,43,69,.04)}
.bar,nav,main{max-width:1180px}main{padding:26px 24px}.bar{padding:16px 24px}.bar h1{font-size:21px;letter-spacing:-.6px}
h2{font-size:25px;letter-spacing:-.6px}h3{font-size:17px}.card{padding:17px 18px}.title{line-height:1.55}.btn{min-height:36px}.btn:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.area-loc{--area:#7645bd;--area-soft:#f1eafb}
.area-cometx{--area:#22764f;--area-soft:#e8f4ed}
.area-personal{--area:#245fc0;--area-soft:#eaf1fe}
.area-consult{--area:#9a570c;--area-soft:#fff2df}
.area-other{--area:#657185;--area-soft:#edf0f5}
.area-tag{background:var(--area-soft)!important;color:var(--area)!important;font-weight:650;padding:3px 10px}
.area-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--area);margin-right:7px}
.area-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0 24px}
.area-tile{position:relative;text-align:left;padding:18px;border:1px solid var(--border);border-top:4px solid var(--area);border-radius:14px;background:var(--surface);cursor:pointer;box-shadow:var(--shadow)}
.area-tile:hover{background:var(--area-soft)}.area-tile strong{display:block;font-size:16px;color:var(--area)}.area-tile .area-desc{display:block;color:var(--muted);font-size:12px;min-height:36px;margin-top:4px}
.area-tile b{font-size:32px;letter-spacing:-1px}.area-tile .area-count{display:flex;align-items:baseline;gap:8px;margin-top:13px}
.area-tile .area-foot{display:block;font-size:12px;margin-top:5px;color:var(--muted)}
.area-card{border-left:4px solid var(--area)}.area-card .muted{overflow-wrap:anywhere}
.area-filters{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.area-filter{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:13px}
.area-filter[aria-pressed="true"]{background:var(--area-soft,var(--accent-soft));border-color:var(--area,var(--accent));box-shadow:inset 0 0 0 1px var(--area,var(--accent))}
.task-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:18px 0 28px}.task-group{min-width:0}.task-group h3{display:flex;align-items:center;gap:8px;color:var(--area);margin:0 0 12px}.task-group h3 .tag{margin-left:auto}.task-group .empty{text-align:left;background:var(--area-soft);border:0;font-size:13px}
.task-note{margin-top:9px;font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.task-meta{margin-top:9px}
.overview-intro{margin:0;color:var(--muted)}.report-section{margin-top:24px}.stats{gap:12px}.stat{border-radius:12px;padding:14px}.stat b{font-size:27px}.group-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:24px}
@media(prefers-color-scheme:dark){:root{--bg:#121923;--surface:#1b2533;--surface-2:#243143;--border:#344156;--text:#edf2fa;--muted:#aab8cc}
.area-loc{--area:#c5a6ff;--area-soft:#302343}.area-cometx{--area:#86d4ab;--area-soft:#1c362e}.area-personal{--area:#95b9ff;--area-soft:#203352}.area-consult{--area:#f3c17f;--area-soft:#3b2d1f}.area-other{--area:#b9c5d8;--area-soft:#2a3546}}
@media(max-width:800px){.area-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.task-groups{grid-template-columns:1fr}}
@media(max-width:600px){main{padding:18px 12px}.bar{padding:12px}.bar h1{font-size:19px}.sync{font-size:11px}.area-grid{gap:9px}.area-tile{padding:13px}.area-tile strong{font-size:14px}.area-tile b{font-size:26px}.area-tile .area-desc{min-height:36px}.card{padding:14px}.group-heading{align-items:center}}


.calendar-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}.calendar-toolbar h3{margin:0;flex:1;text-transform:capitalize}
.calendar-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.calendar-weekday{background:var(--surface-2);text-align:center;padding:8px;font-size:12px;font-weight:600}.calendar-day{background:var(--surface);padding:6px;min-height:108px;min-width:0}.calendar-day.outside{background:var(--bg)}.calendar-day.selected{box-shadow:inset 0 0 0 2px var(--accent)}.calendar-day.today .day-number{background:var(--accent);color:#fff;border-radius:50%}
.day-number{display:block;border:0;background:none;cursor:pointer;width:29px;height:29px;margin-bottom:4px}.calendar-item{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--area);border-radius:4px;padding:3px 5px;margin:3px 0;font-size:11px;background:var(--area-soft);color:var(--area);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.calendar-more{font-size:11px;color:var(--muted);border:0;background:none;cursor:pointer}.calendar-agenda h3{margin-top:0}.agenda-time{font-size:12px;color:var(--muted)}.calendar-legend{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0;font-size:12px}.calendar-task-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
@media(max-width:1000px){.calendar-layout{grid-template-columns:1fr}.calendar-agenda{margin-top:8px}}@media(max-width:600px){.calendar-day{min-height:65px;padding:3px}.calendar-item{font-size:0;min-height:8px;padding:0;border-left-width:0}.calendar-weekday{padding:6px 1px}.calendar-more{font-size:10px}.day-number{width:25px;height:25px}.calendar-toolbar{gap:6px}}

</style>
</head>
<body>
<header>
  <div class="bar"><h1>Asistent</h1><span class="sync" id="sync"></span><button class="btn sm" id="btnSettings" title="Nastavení připojení">Nastavení</button></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ---------- konfigurace ---------- */
const CFG_KEY = 'asistent.cfg.v1';
const DEFAULT_CFG = { owner: 'pruskaadam-hub', repo: 'asistent-data', branch: 'main', token: '' };
let cfg = Object.assign({}, DEFAULT_CFG);
try { Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); } catch (e) {}
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }

const FILES = {
  zdroje: 'zdroje.json', pravidla: 'pravidla.json', ukoly: 'ukoly.json', kontakty: 'kontakty.json',
  faktury: 'faktury.json', koncepty: 'koncepty.json', zapisy: 'zapisy.json', zpetna: 'zpetna-vazba.json',
  report: 'reporty/dnes.md', plandata: 'planovani.json', vecer: 'reporty/vecer.md', tyden: 'reporty/tyden.md', anotace: 'anotace.json'
};
const store = {}, shas = {};

/* ---------- pomocné ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const fmtDate = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return d ? `${+d}. ${+m}. ${y}` : s; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
function setSync(msg) { $('#sync').textContent = msg; }
function b64decode(s) { const bin = atob(s.replace(/\n/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function b64encode(str) { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function mdToHtml(md) {
  const lines = String(md || '').split('\n'); let html = '', inList = false;
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>');
  for (const raw of lines) {
    const l = raw.trimEnd();
    if (/^\s*[-*] /.test(l)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>'; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (/^### /.test(l)) html += '<h4>' + inline(l.slice(4)) + '</h4>';
    else if (/^##? /.test(l)) html += '<h3>' + inline(l.replace(/^##? /, '')) + '</h3>';
    else if (l.trim()) html += '<p>' + inline(l) + '</p>';
  }
  if (inList) html += '</ul>';
  return html;
}

/* ---------- GitHub API ---------- */
function apiUrl(path, withRef) {
  const p = path.split('/').map(encodeURIComponent).join('/');
  return `https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${p}` + (withRef ? `?ref=${encodeURIComponent(cfg.branch)}` : '');
}
function headers() { return { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; }
async function loadFile(key) {
  const r = await fetch(apiUrl(FILES[key], true), { headers: headers(), cache: 'no-store' });
  if (r.status === 404) { store[key] = defaultFor(key); shas[key] = undefined; return; }
  if (r.status === 401) throw new Error('Token je neplatný nebo vypršel.');
  if (!r.ok) throw new Error(`GitHub vrátil chybu ${r.status} u ${FILES[key]}.`);
  const j = await r.json(); shas[key] = j.sha;
  const text = b64decode(j.content || '');
  if (['report','vecer','tyden'].includes(key)) store[key] = text;
  else { try { store[key] = JSON.parse(text || 'null') ?? defaultFor(key); } catch (e) { throw new Error(`Soubor ${FILES[key]} není platný JSON.`); } }
}
function defaultFor(key) { return ['report','vecer','tyden'].includes(key) ? '' : key === 'plandata' ? {busy:[],udalosti:[],pripravy:[],chyby:['Kalendáře zatím nebyly načteny.']} : key === 'pravidla' ? { profil: '', oblasti: [], autonomie: [], rutiny: [], obecna_pravidla: '' } : []; }
async function saveFile(key, message) {
  setSync('Ukládám…');
  const content = ['report','vecer','tyden'].includes(key) ? store[key] : JSON.stringify(store[key], null, 2) + '\n';
  const body = { message: message || `Panel: úprava ${FILES[key]}`, content: b64encode(content), branch: cfg.branch };
  if (shas[key]) body.sha = shas[key];
  const r = await fetch(apiUrl(FILES[key], false), { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, headers()), body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) {
    setSync('Konflikt');
    toast('Soubor mezitím změnil asistent. Načítám aktuální verzi, proveďte úpravu znovu.');
    await loadFile(key); render(); return false;
  }
  if (!r.ok) { setSync('Chyba ukládání'); toast(`Uložení selhalo (${r.status}).`); return false; }
  const j = await r.json(); shas[key] = j.content && j.content.sha;
  setSync('Uloženo ' + new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }));
  return true;
}
async function loadAll() {
  setSync('Načítám…');
  const repoCheck = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}`, { headers: headers(), cache: 'no-store' });
  if (!repoCheck.ok) throw new Error('Datový repozitář není dostupný. Zkontrolujte název a oprávnění tokenu.');
  const repoInfo = await repoCheck.json();
  if (!repoInfo.private) throw new Error('Pro osobní data použijte soukromý repozitář.');
  await Promise.all(Object.keys(FILES).map(loadFile));
  setSync('Načteno ' + new Date().toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' }));
}


const AREAS = [
  {key:'CometX',label:'CometX',desc:'Komunita, spolek a SCAS',cls:'area-cometx'},
  {key:'Osobní',label:'Osobní',desc:'Dům, rodina a osobní schůzky',cls:'area-personal'},
  {key:'LOC',label:'Lab On Card',desc:'Práce, partneři a projekty',cls:'area-loc'},
  {key:'Konzultace',label:'Konzultace',desc:'Vedlejší obživa a klienti',cls:'area-consult'}
];
function areaInfo(key) { return AREAS.find(a => a.key === key) || {key:key || '', label:key || 'Bez oblasti', cls:'area-other',desc:''}; }
function areaTag(key) { const a=areaInfo(key); return '<span class="tag area-tag '+a.cls+'"><span class="area-dot" aria-hidden="true"></span>'+esc(a.label)+'</span>'; }
function areaOverview() {
  const tasks=(store.ukoly||[]).filter(x=>x.stav!=='hotovo');
  return '<div class="area-grid">'+AREAS.map(a=>{
    const items=tasks.filter(x=>x.oblast===a.key);
    const late=items.filter(x=>x.termin && x.termin<today()).length;
    const urgent=items.filter(x=>x.priorita==='vysoká').length;
    return '<button class="area-tile '+a.cls+'" data-open-area="'+esc(a.key)+'" aria-label="'+esc(a.label)+': '+items.length+' otevřených úkolů"><strong><span class="area-dot" aria-hidden="true"></span>'+esc(a.label)+'</strong><span class="area-desc">'+esc(a.desc)+'</span><span class="area-count"><b>'+items.length+'</b><span class="muted">otevřených úkolů</span></span><span class="area-foot">'+(late?late+' po termínu':urgent?urgent+' s vysokou prioritou':'Zobrazit úkoly →')+'</span></button>';
  }).join('')+'</div>';
}
function areaFilters(key) {
  const selected=(ui.filters[key]||{}).oblast||'';
  const values=Array.from(new Set(AREAS.map(a=>a.key).concat((store[key]||[]).map(x=>x.oblast).filter(Boolean))));
  return '<div class="area-filters" role="group" aria-label="Filtrovat podle oblasti"><button class="area-filter" data-area-filter="" aria-pressed="'+(!selected)+'">Všechny oblasti</button>'+values.map(k=>{
    const a=areaInfo(k),n=(store[key]||[]).filter(x=>x.oblast===k).length;
    return '<button class="area-filter '+a.cls+'" data-area-filter="'+esc(k)+'" aria-pressed="'+(selected===k)+'"><span class="area-dot" aria-hidden="true"></span>'+esc(a.label)+' · '+n+'</button>';
  }).join('')+'</div>';
}
function groupedTasks(items,renderCard) {
  const keys=Array.from(new Set(AREAS.map(a=>a.key).concat(items.map(x=>x.oblast||''))));
  return '<div class="task-groups">'+keys.map(k=>{
    const a=areaInfo(k),rows=items.filter(x=>(x.oblast||'')===k);
    return '<section class="task-group '+a.cls+'"><h3><span><span class="area-dot" aria-hidden="true"></span>'+esc(a.label)+'</span><span class="tag">'+rows.length+'</span></h3>'+(rows.length?rows.map(renderCard).join(''):'<div class="empty">V této oblasti nejsou žádné úkoly.</div>')+'</section>';
  }).join('')+'</div>';
}

/* ---------- schémata kolekcí ---------- */
const oblastOpts = () => ((store.pravidla && store.pravidla.oblasti) || []).map(o => o.kod).filter(Boolean);
const SCHEMAS = {
  ukoly: {
    title: 'Úkoly', addLabel: 'Nový úkol', searchKeys: ['nazev', 'poznamka', 'zdroj', 'projekt', 'dalsi_krok', 'cekam_na', 'slib_komu'],
    fields: [
      { k: 'nazev', l: 'Úkol', t: 'text', req: 1, wide: 1 },
      { k: 'oblast', l: 'Oblast', t: 'oblast', filter: 1 },
      { k: 'termin', l: 'Termín', t: 'date' },
      { k: 'priorita', l: 'Priorita', t: 'select', o: ['vysoká', 'střední', 'nízká'], def: 'střední' },
      { k: 'stav', l: 'Stav', t: 'select', o: ['otevřený', 'rozpracovaný', 'čeká na jiné', 'hotovo'], def: 'otevřený', quick: 1, filter: 1 },
      { k: 'zdroj', l: 'Zdroj', t: 'text', ph: 'e-mail, Plaud, WhatsApp…' },
      { k: 'odhad_min', l: 'Odhad délky (minuty)', t: 'number' },
      { k: 'odhad_typ', l: 'Původ odhadu', t: 'select', o: ['odhad AI', 'vlastní odhad'], def: 'vlastní odhad' },
      { k: 'projekt', l: 'Projekt', t: 'text', ph: 'Dům, symposium, klient…' },
      { k: 'dalsi_krok', l: 'Nejbližší konkrétní krok', t: 'text', wide: 1 },

function tag(t, cls) { return `<span class="tag ${cls || ''}">${esc(t)}</span>`; }
function dueTag(d, done, label) {
  const t = today(); const txt = (label ? label + ' ' : '') + fmtDate(d);
  if (done) return tag(txt);
  return d < t ? tag('po termínu · ' + txt, 'bad') : d === t ? tag('dnes', 'warn') : tag(txt);
}
function stavClass(v) { return ({ 'Aktivní': 'good', 'Vypnuto': '', 'Čeká na schválení': 'warn', 'Plánováno': 'acc', 'hotovo': 'good', 'zaplaceno': 'good', 'nezaplaceno': 'warn' })[v] || ''; }

/* ---------- navigace ---------- */
const TABS = [

  ['zapisy', 'Zápisy'], ['zdroje', 'Zdroje'], ['uceni', 'Učení'], ['zpetna', 'Zpětná vazba']
];
let tab = 'dnes';
try { tab = localStorage.getItem('asistent.tab') || 'dnes'; } catch (e) {}
const ui = { filters: {}, q: {}, editing: null, adding: false, conceptView: 'ceka' };
function renderNav() {
  const pending = (store.koncepty || []).filter(c => c.stav === 'navrh').length;
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}${k === 'schvaleni' && pending ? `<span class="count">${pending}</span>` : ''}</button>`).join('');
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; ui.editing = null; ui.adding = false;
  try { localStorage.setItem('asistent.tab', tab); } catch (err) {}
  render(); window.scrollTo(0, 0);
});
$('#btnSettings').addEventListener('click', () => { tab = '__settings'; render(); });

function render() {
  if (!cfg.token || tab === '__settings') { $('#nav').innerHTML = ''; return renderLogin(); }
  renderNav();
  const m = $('#main');
  if (tab === 'dnes') m.innerHTML = renderDnes();
  else if (tab === 'kalendar') m.innerHTML = renderCalendar();
  else if (tab === 'plan') m.innerHTML = renderPlan();
  else if (tab === 'schvaleni') m.innerHTML = renderSchvaleni();
  else if (tab === 'uceni') m.innerHTML = renderUceni();
  else if (SCHEMAS[tab]) m.innerHTML = renderCollection(tab);
}

    <div class="row" style="margin-top:14px"><button class="btn pri" id="cSave">Připojit</button>${cfg.token ? '<button class="btn" id="cCancel">Zpět</button><button class="btn bad" id="cLogout">Odhlásit</button>' : ''}</div>
    <p class="muted" id="cErr" style="color:var(--bad)"></p>

  const koncepty = (store.koncepty || []).filter(c => c.stav === 'navrh');
  const fu = (store.kontakty || []).filter(x => x.followup && x.followup <= t);
  const fakt = (store.faktury || []).filter(x => x.stav === 'nezaplaceno' && x.splatnost && x.splatnost <= t);
  const zdrojeProblem = (store.zdroje || []).filter(x => x.stav === 'Aktivní' && /chyba|nefunguje/i.test(x.poznamka || ''));
  const list = (arr, fn) => arr.length ? arr.map(fn).join('') : '';
  const taskCard = x => `<div class="card area-card ${areaInfo(x.oblast).cls}"><div class="row"><span class="grow title">${esc(x.nazev)}</span>${x.oblast ? areaTag(x.oblast) : ''}${dueTag(x.termin)}<button class="btn sm" data-act="done" data-id="${esc(x.id)}">Hotovo</button></div></div>`;
  return `<h2>${new Date().toLocaleDateString('cs-CZ', { weekday: 'long', day: 'numeric', month: 'long' })}</h2>
  <p class="overview-intro">Vše podstatné z tvých čtyř oblastí na jednom místě.</p>\n  ${areaOverview()}\n  <div class="stats">
    <div class="stat" data-go="ukoly"><span class="muted">Po termínu</span><b style="color:${late.length ? 'var(--bad)' : 'inherit'}">${late.length}</b></div>
    <div class="stat" data-go="ukoly"><span class="muted">Na dnes</span><b>${now.length}</b></div>
    <div class="stat" data-go="schvaleni"><span class="muted">Ke schválení</span><b>${koncepty.length}</b></div>
    <div class="stat" data-go="kontakty"><span class="muted">Follow-upy</span><b>${fu.length}</b></div>
    <div class="stat" data-go="faktury"><span class="muted">Faktury k řešení</span><b>${fakt.length}</b></div>
  </div>
  ${zdrojeProblem.length ? `<div class="card" style="border-color:var(--warn)"><b>Pozor na zdroje:</b> ${zdrojeProblem.map(z => esc(z.nazev)).join(', ')}</div>` : ''}
  <div class="group-heading"><h3>Otevřené úkoly podle oblastí</h3><button class="btn sm" data-go="ukoly">Všechny úkoly →</button></div>
  ${groupedTasks(ukoly.slice().sort(SCHEMAS.ukoly.sort), x => '<div class="card area-card '+areaInfo(x.oblast).cls+'"><div class="row"><span class="grow title">'+esc(x.nazev)+'</span></div><div class="row task-meta">'+(x.termin?dueTag(x.termin):'<span class="muted">Bez termínu</span>')+(x.priorita==='vysoká'?tag('Vysoká priorita','bad'):'')+'<span class="grow"></span><button class="btn sm" data-act="done" data-id="'+esc(x.id)+'">Hotovo</button></div></div>')}
  <div class="card"><div class="row"><b class="grow">Co se dnes opravdu vejde?</b><button class="btn pri" data-go="plan">Plán, termíny a uzavření dne →</button></div></div>
  <h3>Report asistenta</h3>
  <div class="card md">${store.report ? mdToHtml(store.report) : '<span class="muted">Asistent zatím report nevytvořil. Objeví se tu po prvním ranním běhu.</span>'}</div>
  ${late.length ? '<h3>Po termínu</h3>' + list(late, taskCard) : ''}
  ${now.length ? '<h3>Na dnes</h3>' + list(now, taskCard) : ''}
  ${fu.length ? '<h3>Ozvat se</h3>' + list(fu, x => `<div class="card"><div class="row"><span class="grow title">${esc(x.jmeno)}${x.organizace ? ' · ' + esc(x.organizace) : ''}</span>${dueTag(x.followup)}</div>${x.sliby ? `<div class="muted">${esc(x.sliby)}</div>` : ''}</div>`) : ''}
  ${fakt.length ? '<h3>Faktury po splatnosti</h3>' + list(fakt, x => `<div class="card"><div class="row"><span class="grow title">${esc(x.protistrana)}${x.cislo ? ' · ' + esc(x.cislo) : ''}</span><b>${Number(x.castka || 0).toLocaleString('cs-CZ')} ${esc(x.mena || '')}</b>${dueTag(x.splatnost)}</div></div>`) : ''}`;

/* ---------- Ke schválení ---------- */
function renderSchvaleni() {
  const all = store.koncepty || [];
  const view = ui.conceptView;
  const items = all.filter(c => view === 'ceka' ? c.stav === 'navrh' : c.stav !== 'navrh').sort((a, b) => String(b.vytvoreno || '').localeCompare(String(a.vytvoreno || '')));
  const lbl = { navrh: ['čeká', 'warn'], schvaleno: ['schváleno', 'good'], odeslano: ['odesláno', 'good'], zamitnuto: ['zamítnuto', 'bad'] };
  return `<h2>Ke schválení</h2>
  <p class="muted">Koncepty e-mailů od asistenta. Upravený text se uloží jako příklad vašeho stylu. Odesíláte vždy sami z původní schránky.</p>
  <div class="toolbar"><button class="btn ${view === 'ceka' ? 'pri' : ''}" data-cview="ceka">Čeká (${all.filter(c => c.stav === 'navrh').length})</button><button class="btn ${view === 'hotovo' ? 'pri' : ''}" data-cview="hotovo">Vyřízené</button></div>
  ${items.length ? items.map(c => `<div class="card" data-cid="${esc(c.id)}">
    <div class="row"><span class="grow title">${esc(c.predmet || '(bez předmětu)')}</span>${c.oblast ? areaTag(c.oblast) : ''}${tag(...(lbl[c.stav] || [c.stav]))}</div>
    <div class="muted">Komu: ${esc(c.komu || '')}${c.odeslat_z ? ' · odeslat z: ' + esc(c.odeslat_z) : ''}${c.vytvoreno ? ' · ' + fmtDate(c.vytvoreno) : ''}</div>
    ${c.kontext ? `<div class="muted" style="margin-top:4px">Kontext: ${esc(c.kontext)}</div>` : ''}
    ${c.stav === 'navrh' ? `<textarea data-ctext style="min-height:160px;margin-top:8px">${esc(c.text)}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn good" data-cact="schvalit">Schválit a zkopírovat</button><button class="btn" data-cact="kopirovat">Kopírovat</button><button class="btn" data-cact="ulozit">Uložit úpravu</button><button class="btn bad" data-cact="zamitnout">Zamítnout</button></div>`
      : `<pre class="draft">${esc(c.text)}</pre>${c.stav === 'schvaleno' ? '<div class="row"><button class="btn sm" data-cact="kopirovat">Kopírovat</button><button class="btn sm" data-cact="odeslano">Označit jako odesláno</button></div>' : ''}`}
  </div>`).join('') : `<div class="empty">${view === 'ceka' ? 'Žádné koncepty nečekají na schválení.' : 'Zatím nic vyřízeného.'}</div>`}`;
}
async function conceptAction(id, act, card) {
  const c = (store.koncepty || []).find(x => x.id === id); if (!c) return;
  const ta = card.querySelector('[data-ctext]');
  if (ta && ta.value !== c.text) { if (c.puvodni_text == null) c.puvodni_text = c.text; c.text = ta.value; c.upraveno = true; }
  if (act === 'kopirovat' || act === 'schvalit') { try { await navigator.clipboard.writeText((c.predmet ? 'Předmět: ' + c.predmet + '\n\n' : '') + c.text); toast('Zkopírováno do schránky'); } catch (e) { toast('Kopírování se nepodařilo, označte text ručně.'); } }
  if (act === 'kopirovat') { if (ta) await saveFile('koncepty', 'Panel: úprava konceptu'); return; }
  if (act === 'schvalit') { c.stav = 'schvaleno'; c.vyrizeno = today(); }
  if (act === 'zamitnout') { c.stav = 'zamitnuto'; c.vyrizeno = today(); }
  if (act === 'odeslano') { c.stav = 'odeslano'; c.odeslano = today(); }
  const ok = await saveFile('koncepty', `Panel: koncept ${act}`);
  if (ok) { if (act !== 'ulozit') toast({ schvalit: 'Schváleno', zamitnout: 'Zamítnuto', odeslano: 'Označeno jako odesláno' }[act] || 'Uloženo'); render(); }
}

/* ---------- obecná kolekce ---------- */
function renderCollection(key) {
  const S = SCHEMAS[key]; const items = (store[key] || []).slice();
  const f = ui.filters[key] || {}; const q = (ui.q[key] || '').toLowerCase();
  let shown = items.filter(x => Object.entries(f).every(([k, v]) => !v || x[k] === v));
  if (q) shown = shown.filter(x => S.searchKeys.some(k => String(x[k] || '').toLowerCase().includes(q)));
  if (S.sort) shown.sort(S.sort);
  const filterFields = S.fields.filter(fd => fd.filter);
  const toolbar = `<div class="toolbar"><input placeholder="Hledat…" data-q value="${esc(ui.q[key] || '')}">
    ${filterFields.map(fd => { const opts = fd.t === 'oblast' ? oblastOpts() : fd.o; return `<select data-filter="${fd.k}"><option value="">${esc(fd.l)}: vše</option>${opts.map(o => `<option ${f[fd.k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`; }).join('')}
    <button class="btn pri" data-act="add">+ ${esc(S.addLabel)}</button></div>`;
  const card = x => {
    if (ui.editing === x.id) return formHtml(key, x);
    const meta = (S.meta ? S.meta(x) : []).filter(Boolean).join(' ');
    const quick = S.fields.filter(fd => fd.quick).map(fd => `<select class="inline" data-quick="${fd.k}" data-id="${esc(x.id)}" title="${esc(fd.l)}">${fd.o.map(o => `<option ${x[fd.k] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`).join('');
    const title = S.titleOf ? S.titleOf(x) : x[S.fields[0].k];

function collectUceni() {

  document.querySelectorAll('[data-r]').forEach(el => { const r = p.rutiny[+el.dataset.i]; r[el.dataset.r] = el.dataset.r === 'aktivni' ? el.value === 'ano' : el.value; });
}

$('#main').addEventListener('click', async e => {

  if (t.dataset.nav) {

});

const planUI={date:today(),duration:30};
function taskDetails(x) {
  return (x.kontext_adama ? '<div class="card" style="margin-top:10px;background:var(--surface-2)"><b>Moje upřesnění</b><div class="task-note">'+esc(x.kontext_adama)+'</div></div>':'') + (x.dalsi_krok ? '<div class="task-note"><b>Další krok:</b> '+esc(x.dalsi_krok)+'</div>':'')
    +(x.kroky ? '<details class="task-note"><summary>Kroky projektu</summary><p style="white-space:pre-wrap">'+esc(x.kroky)+'</p></details>':'')
    +(x.cekam_na ? '<div class="task-note">Čekám na: '+esc(x.cekam_na)+'</div>':'')
    +(x.slib_komu ? '<div class="task-note">Slíbeno: '+esc(x.slib_komu)+'</div>':'')
    +(x.pripomenout ? '<div class="task-note">Follow-up: '+fmtDate(x.pripomenout)+'</div>':'');
}
function nextDate(d) { const t=new Date(d+'T12:00:00Z');t.setUTCDate(t.getUTCDate()+1);return t.toISOString().slice(0,10); }
function localInstant(date,hm) {
  let target=Date.parse(date+'T'+hm+':00Z'),value=target;
  for(let i=0;i<3;i++){
    const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(value)).map(x=>[x.type,x.value]));
    value+=target-Date.parse(p.year+'-'+p.month+'-'+p.day+'T'+p.hour+':'+p.minute+':'+p.second+'Z');
  }
  return value;
}
function planningCfg() { return Object.assign({zacatek:'09:00',konec:'17:00',rezerva_min:15,kapacita_procent:70},store.pravidla?.planovani||{}); }
function calendarIssue(date) {
  const p=store.plandata||{};
  if(!p.aktualizovano || !p.od || !p.do || date<p.od || date>p.do) return 'Pro tento den nejsou načtené kalendáře. Počkej na aktualizaci asistenta.';
  if(p.chyby?.length) return 'Některé kalendáře se nepodařilo načíst. Volné termíny nelze spolehlivě určit.';
  if(Date.now()-Date.parse(p.aktualizovano)>24*3600000) return 'Podklady kalendářů jsou starší než 24 hodin. Počkej na obnovení.';
  return '';
}
function freeWindows(date,now=Date.now()) {
  if(calendarIssue(date))return [];
  const c=planningCfg(),begin=localInstant(date,c.zacatek),end=localInstant(date,c.konec),pad=Math.max(0,Number(c.rezerva_min)||0)*60000;
  let cursor=Math.max(begin, date===today()?Math.ceil(now/300000)*300000:begin);
  if(cursor>=end)return [];
  const intervals=[...(store.plandata.busy||[]),...manualEvents(date).filter(x=>x.obsazeno!==false).map(x=>({start:x.start,end:x.end}))].map(b=>[(/^\d{4}-\d{2}-\d{2}$/.test(b.start)?localInstant(b.start,'00:00'):Date.parse(b.start))-pad,(/^\d{4}-\d{2}-\d{2}$/.test(b.end)?localInstant(b.end,'00:00'):Date.parse(b.end))+pad]).filter(b=>Number.isFinite(b[0])&&Number.isFinite(b[1])&&b[1]>cursor&&b[0]<end).sort((a,b)=>a[0]-b[0]);
  const result=[];for(const [a,b]of intervals){if(a>cursor)result.push([cursor,Math.min(a,end)]);cursor=Math.max(cursor,b);if(cursor>=end)break;}if(cursor<end)result.push([cursor,end]);return result;
}
function minutesOf(x) { return Math.max(5,Math.min(480,Number(x.odhad_min)||30)); }
function priorityTasks(date) {
  const rank={'vysoká':0,'střední':1,'nízká':2};
  return (store.ukoly||[]).filter(x=>x.stav!=='hotovo'&&x.stav!=='čeká na jiné'&&!x.cekam_na&&(!x.plan_datum||x.plan_datum<=date))
    .sort((a,b)=>Number(!!b.termin&&b.termin<=date)-Number(!!a.termin&&a.termin<=date)||(rank[a.priorita]??1)-(rank[b.priorita]??1)||String(a.termin||'9999').localeCompare(String(b.termin||'9999')));
}
function makeDayPlan(date,now=Date.now()) {
  const windows=freeWindows(date,now).map(x=>x.slice()),raw=windows.reduce((n,w)=>n+(w[1]-w[0])/60000,0);
  const capacity=Math.floor(raw*Math.max(10,Math.min(100,Number(planningCfg().kapacita_procent)||70))/100);
  let used=0;const slots=[],backlog=[];
  for(const x of priorityTasks(date)){
    const minutes=minutesOf(x),index=windows.findIndex(w=>w[1]-w[0]>=minutes*60000);
    if(slots.length>=3||used+minutes>capacity||index<0){backlog.push(x);continue;}
    const start=windows[index][0];slots.push({task:x,start,end:start+minutes*60000,minutes});windows[index][0]+=minutes*60000;used+=minutes;
  }
  return {slots,backlog,capacity,used,free:Math.floor(raw)};
}
const timeLabel = n => new Date(n).toLocaleTimeString('cs-CZ',{timeZone:'Europe/Prague',hour:'2-digit',minute:'2-digit'});
function renderPlan() {

  const duration=Number(planUI.duration)||30;
  const suggestions=freeWindows(date).flatMap(w=>{let a=[];for(let t=w[0];t+duration*60000<=w[1]&&a.length<3;t+=Math.max(30,duration+Number(c.rezerva_min))*60000)a.push([t,t+duration*60000]);return a;}).slice(0,3);
  const open=all.filter(x=>x.stav!=='hotovo');
  return '<h2>Plán a kapacita</h2><p class="overview-intro">Tři priority, čas na soustředění a prostor pro nečekané věci.</p>'
  +'<div class="card" style="margin-top:18px"><div class="form"><div><label for="planDate">Den</label><input id="planDate" type="date" value="'+esc(date)+'"></div><div><label for="dayStart">Začátek dne</label><input id="dayStart" type="time" value="'+esc(c.zacatek)+'"></div><div><label for="dayEnd">Konec dne</label><input id="dayEnd" type="time" value="'+esc(c.konec)+'"></div><div><label for="bufferMin">Rezerva kolem schůzek (min)</label><input id="bufferMin" type="number" min="0" max="120" value="'+esc(c.rezerva_min)+'"></div><div><label for="capacityPct">Kolik volného času plánovat (%)</label><input id="capacityPct" type="number" min="10" max="100" value="'+esc(c.kapacita_procent)+'"></div></div><button class="btn" style="margin-top:12px" data-plan-act="settings">Uložit kapacitu</button><p class="muted">Výchozí návrh je 9–17, 15 minut na přípravu/přesun a 30 % volné kapacity jako rezerva. Uprav podle svého dne.</p></div>'
  +(issue?'<div class="card"><b>'+esc(issue)+'</b></div>':'')
  +'<p class="muted">Kalendáře aktualizované: '+esc(store.plandata?.aktualizovano?new Date(store.plandata.aktualizovano).toLocaleString('cs-CZ',{timeZone:'Europe/Prague'}):'zatím ne')+'. Návrhy platí pro načtené aktivní kalendáře; dostupnost ostatních lidí není ověřená.</p>'

 const events=agendaEvents(date).filter(x=>!calUI.area||x.oblast===calUI.area).filter(x=>pragueDate(x.start)<=date&&pragueDate(x.end)>=date&&Date.parse(x.end)>localInstant(date,'00:00')).map(x=>({kind:'event',id:x.id,title:x.title,oblast:x.oblast,event:x,label:/^\d{4}-\d{2}-\d{2}$/.test(x.start)?'Celý den':timeLabel(Date.parse(x.start))}));
 const busy=(store.plandata?.busy||[]).filter(x=>x.source==='loc-cal'&&(!calUI.area||calUI.area==='LOC')&&Date.parse(x.start)<localInstant(nextDate(date),'00:00')&&Date.parse(x.end)>localInstant(date,'00:00'));
 const dedup=Array.from(new Map(busy.filter(b=>!manualEvents(date).some(e=>Date.parse(e.start)===Date.parse(b.start)&&Date.parse(e.end)===Date.parse(b.end))).map(x=>[x.start+'|'+x.end,x])).values()).map(x=>({kind:'busy',id:busyKey(x),title:annotationFor(busyKey(x))?.nazev||'Lab On Card · obsazeno',oblast:'LOC',busy:x,annotation:annotationFor(busyKey(x)),label:timeLabel(Date.parse(x.start))+'–'+timeLabel(Date.parse(x.end))}));

 return [...events,...dedup,...tasks,...followups].sort((a,b)=>{const at=a.event?Date.parse(a.event.start):a.busy?Date.parse(a.busy.start):Infinity,bt=b.event?Date.parse(b.event.start):b.busy?Date.parse(b.busy.start):Infinity;return at-bt||a.title.localeCompare(b.title,'cs');});

/* ---------- Adamovy anotace a vlastní agenda ---------- */
const annotationUI={editing:null,kind:'',target:null,date:''};
function annotationFor(key) { return (store.anotace||[]).find(x=>x.source_key===key); }
function eventKey(e) {return 'event:'+e.calendar_id+':'+e.id;}
function busyKey(b) {return 'busy:loc-cal:'+b.start+'|'+b.end;}
function manualEvents(date) {
 const out=[];
 for(const x of (store.anotace||[]).filter(x=>x.typ==='vlastni-udalost')){
  const dates=[];
  if(x.opakovani){
   const anchor=pragueDate(x.start),finish=date||store.plandata?.do||nextDate(today()),first=date||store.plandata?.od||today();
   if(!anchor)continue;
   for(let d=first,n=0;d<=finish&&n<370;d=nextDate(d),n++){
    const delta=Math.round((Date.parse(d+'T12:00:00Z')-Date.parse(anchor+'T12:00:00Z'))/86400000);
    if(delta>=0&&delta%(7*Math.max(1,Number(x.opakovani.interval_tydnu)||1))===0)dates.push(d);
   }
  }else dates.push(pragueDate(x.start));
  for(const d of dates){
   const repeated=!!x.opakovani;
   const start=repeated?new Date(localInstant(d,timeLabel(Date.parse(x.start)))).toISOString():x.start;
   const end=repeated?new Date(localInstant(d,timeLabel(Date.parse(x.end)))).toISOString():x.end;
   const specific=repeated?annotationFor('occurrence:'+x.id+':'+d):null;
   out.push({id:x.id,calendar_id:'rucni-agenda',source:'rucni-agenda',title:specific?.nazev||x.nazev,start,end,description:specific?.kontext||x.kontext,oblast:specific?.oblast||x.oblast,obsazeno:x.obsazeno,annotation:specific||x,series_id:repeated?x.id:null,occurrence_date:d});
  }
 }
 return out;
}
function agendaEvents(date) {
 return (store.plandata?.udalosti||[]).map(e=>{
  const a=annotationFor(eventKey(e));
  return a?{...e,title:a.nazev||e.title,oblast:a.oblast||e.oblast,annotation:a}:e;
 }).concat(manualEvents(date));
}
function annotationControls(x) {
 if(x.kind!=='event'&&x.kind!=='busy')return '';
 const key=x.kind==='busy'?busyKey(x.busy):x.event.series_id?'occurrence:'+x.event.series_id+':'+x.event.occurrence_date:x.event.source==='rucni-agenda'?x.event.id:eventKey(x.event);
 const a=x.kind==='busy'?annotationFor(key):x.event.annotation;
 return (a?.kontext?'<div class="task-note"><b>Moje upřesnění:</b><br>'+esc(a.kontext)+'</div>':'')
 +'<div class="calendar-task-actions"><button class="btn sm" data-ann-edit="'+esc(key)+'">'+(a?'Upravit moje upřesnění':'Doplnit poznámku / upřesnit')+'</button>'+(a?'<button class="btn sm" data-ann-task="'+esc(a.id)+'">Vytvořit navazující úkol</button>':'')+(x.event?.series_id?'<button class="btn sm" data-ann-edit="'+esc(x.event.series_id)+'">Upravit celou řadu</button>':'')+'</div>';
}

 +(own?'<label for="annDate">Datum</label><input id="annDate" type="date" value="'+esc(date)+'"><label for="annStart">Začátek</label><input id="annStart" type="time" value="'+esc(hm(a.start)||'09:00')+'"><label for="annEndDate">Datum konce</label><input id="annEndDate" type="date" value="'+esc(pragueDate(a.end)||date)+'"><label for="annEnd">Konec</label><input id="annEnd" type="time" value="'+esc(hm(a.end)||'10:00')+'"><label for="annBusy">Započítat do obsazenosti</label><select id="annBusy"><option value="ano" '+(a.obsazeno!==false?'selected':'')+'>Ano</option><option value="ne" '+(a.obsazeno===false?'selected':'')+'>Ne, pouze poznámka</option></select>':'')

   const start=localInstant(date,startHm),end=localInstant(endDate,endHm);
   if(!Number.isFinite(start)||!Number.isFinite(end)||end<=start){toast('Konec musí být po začátku.');return;}
   const interval=Number($('#annRepeat').value); if(interval && date!==endDate){toast('Opakovaná událost musí začínat a končit ve stejný den.');return;}
   times={start:new Date(start).toISOString(),end:new Date(end).toISOString(),obsazeno:$('#annBusy').value==='ano',opakovani:interval?{interval_tydnu:interval}:null};
  }
  const value=Object.assign({},a||{id:uid(),vytvoreno:today(),zdroj_zapisu:'panel'},annotationUI.target||{},times,{typ:annotationUI.kind,nazev,oblast,kontext,upraveno:new Date().toISOString(),autor:'Adam'});
  if(own)value.source_key=value.id;
  store.anotace=store.anotace||[];if(a)Object.assign(a,value);else store.anotace.push(value);
  if(await saveFile('anotace','Panel: vlastní událost nebo upřesnění')){annotationUI.kind='';render();toast('Uloženo pro asistenta');}return;
 }
 if(b.dataset.annDelete){
  if(!confirm('Smazat pouze vlastní záznam v panelu? Původní kalendář se nezmění.'))return;
  store.anotace=(store.anotace||[]).filter(x=>x.id!==b.dataset.annDelete);
  if(await saveFile('anotace','Panel: odebrání vlastní anotace')){annotationUI.kind='';render();}return;
 }
 if(b.dataset.annTask){
  const a=(store.anotace||[]).find(x=>x.id===b.dataset.annTask);if(!a)return;
  const id='annotation:'+a.id+':task';
  store.ukoly=store.ukoly||[];
  if(!store.ukoly.some(x=>x.id===id)){
   store.ukoly.push({id,vytvoreno:today(),zdroj_zapisu:'panel',nazev:'Navázat: '+a.nazev,oblast:a.oblast,termin:'',stav:'otevřený',priorita:'střední',kontext_adama:a.kontext||'',zdroj:'Ruční agenda · '+a.id,zdrojove_id:a.id});
   if(!await saveFile('ukoly','Panel: navazující úkol z anotace'))return;
  }
  tab='ukoly';ui.filters.ukoly={};ui.q.ukoly='';ui.adding=false;ui.editing=id;render();
 }
});

/* ---------- start ---------- */
(async () => {
  if (!cfg.token) return render();
  try { await loadAll(); } catch (e) { setSync(e.message); tab = '__settings'; }
  render();
})();
</script>
